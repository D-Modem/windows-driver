#
# The shared code's tests on Linux, then dmodem.sys with clang-retro's
# toolchain, its imports checked against Windows 2000's kernel and 98 SE's
# and ME's WDM, and inf/ checked against D-Modem's.  Then the engine:
# D-Modem's libdmodem built for Linux (the loopback line's test) and with
# clang-retro (dmodem-svc.exe, its imports checked for 98 and 2000).
name: CI

on:
  push:
  pull_request:

env:
  # D-Modem's branch the engine builds on
  DMODEM_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests (port core, engine channel)
        run: make test

      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
        id: clang-dos

      - name: dmodem.sys
        run: make driver CLANG_DOS="$CLANG_DOS"

      - name: Imports (2000, 98 SE, ME)
        run: make check CLANG_DOS="$CLANG_DOS"

      - uses: actions/checkout@v4
        with:
          repository: d-modem/d-modem
          ref: ${{ env.DMODEM_REF }}
          path: D-Modem

      - name: INFs up to date with D-Modem's
        run: make inf-check DMODEM=D-Modem

      - name: Engine's loopback line (Linux)
        run: make engine-test DMODEM=D-Modem

      - name: dmodem-svc.exe, its imports (98, 2000)
        run: make engine DMODEM=D-Modem CLANG_DOS="$CLANG_DOS"

      - uses: actions/upload-artifact@v4
        with:
          name: dmodem-driver
          path: |
            build/dmodem.sys
            build/dmodem.pdb
            build/dmodem-svc.exe
            inf/*.inf
